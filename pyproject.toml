[project]
name = "super-nlm"
version = "0.1.0"
description = "Multi-Account Unified Hub for Google Gemini Notebook"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "qrcode>=7.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
# Optimized for Windows Dev Drive (ReFS) with Block Cloning / Copy-on-Write
link-mode = "clone"
cache-dir = "F:/.uv-cache"
