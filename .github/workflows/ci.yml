name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pytest
        run: uv run --locked --group dev python scripts/verify.py

      - name: Upload verification metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-verification
          path: verification-results/
